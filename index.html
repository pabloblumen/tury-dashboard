<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>TURY · Tablero Comercial</title>
<style>
:root{--bg:#0b0b10;--bg2:#13131c;--bg3:#1a1a26;--border:#2c2c3a;--text:#f0f0f5;--text3:#7a7a8c;--gold:#e0b341;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:380px}
.logo{font-size:34px;font-weight:800;letter-spacing:3px;color:var(--gold)}.logo span{color:var(--text)}
.sub{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:2px 0 22px}
label{font-size:12px;color:var(--text3);display:block;margin-bottom:6px}
input[type=password]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}
input[type=password]:focus{border-color:var(--gold)}
.rm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin:12px 0 18px;cursor:pointer}
.rm input{accent-color:var(--gold)}
button{width:100%;background:var(--gold);color:#1a1300;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:12px;margin-top:12px;min-height:16px}
</style></head><body>
<form class="box" id="f"><div class="logo">TURY<span>·</span></div><div class="sub">Tablero comercial · acceso restringido</div>
<label for="p">Contraseña</label><input type="password" id="p" autocomplete="current-password" autofocus>
<label class="rm"><input type="checkbox" id="r">Recordar en este dispositivo</label>
<button id="b" type="submit">Entrar</button><div class="err" id="e"></div></form>
